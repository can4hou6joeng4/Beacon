# 按改动路径给 PR 打标签（actions/labeler）。标签需事先存在于仓库。
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "web/package.json"
          - "web/package-lock.json"
web:
  - changed-files:
      - any-glob-to-any-file:
          - "web/**"
